<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#7028E8;--ph:#5B21B6;--pl:#F3EDFF;--pl2:#E4D6FF;--bg:#FFFFFF;--bg2:#F8F8FC;--ink:#171717;--ink2:#404040;--muted:#737373;--line:#E9E7EF;--line2:#F1EFF5;--ok:#16A765;--okt:#0E7A4A;--oks:#E8F7EF;--err:#DC2626;--errs:#FDEDED;--star:#F5A524;
--sh:0 1px 2px rgba(23,23,23,.04),0 8px 24px rgba(48,24,110,.07);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#F1F0F5;font-family:Poppins,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:var(--ink)}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}

/* device frame: full screen on phones, centred 390x844 mockup from 500px up */
#app{width:100%;height:100vh;height:100dvh;position:relative;overflow:hidden;background:var(--bg);flex:0 0 auto}
@media(min-width:500px){#app{width:390px;height:844px;border-radius:32px;border:1px solid #E2E0EA;box-shadow:0 30px 70px rgba(48,24,110,.14),0 4px 14px rgba(23,23,23,.06);transform:scale(var(--fit,1))}}

/* layout */
.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.scroll>*{flex-shrink:0}
.hs{display:flex;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 16px}.hs::-webkit-scrollbar{display:none}.hs>*{scroll-snap-align:start}

/* slider: horizontal row with edge fades, desktop arrows, mouse drag and a progress bar */
.slider{position:relative}
.hs.snap{scroll-snap-type:x mandatory}
.slider>.hs{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%)}
.slider.at-start>.hs{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%)}
.slider.at-end>.hs{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 100%)}
.slider.at-start.at-end>.hs{-webkit-mask-image:none;mask-image:none}
.hs.dragging{scroll-snap-type:none;cursor:grabbing;user-select:none}
.hs.dragging *{cursor:grabbing}
.slider img{-webkit-user-drag:none;user-select:none}
.sl-arw{position:absolute;width:36px;height:36px;margin-top:-18px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(23,23,23,.12);display:none;align-items:center;justify-content:center;z-index:3;color:var(--ink);transition:opacity .15s,background .15s}
.sl-arw:hover{background:var(--pl);color:var(--p);border-color:var(--pl2)}
.sl-arw.prev{left:6px}.sl-arw.next{right:6px}
.slider.chips .sl-arw{width:30px;height:30px;margin-top:-15px}
@media(hover:hover) and (pointer:fine){.sl-arw{display:flex}}
.slider.at-start .sl-arw.prev,.slider.at-end .sl-arw.next{opacity:0;pointer-events:none}
.sl-bar{position:relative;width:56px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0;overflow:hidden}
.sl-bar i{position:absolute;top:0;left:0;height:100%;width:30%;border-radius:2px;background:var(--p)}
.slider.at-start.at-end .sl-bar{display:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.page.nav{bottom:calc(68px + var(--sb))}
.enter{animation:pgIn .18s ease-out}
@keyframes pgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.row{display:flex;justify-content:space-between;align-items:center}
.col{display:flex;flex-direction:column}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.blk{padding:24px 0 0}
.muted{color:var(--muted)}
.pc{color:var(--p)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.icon{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* type */
.h1{font-size:24px;font-weight:600;line-height:1.25;letter-spacing:-.02em}
.h2{font-size:18px;font-weight:600;letter-spacing:-.01em}
.h3{font-size:15px;font-weight:600}
.lbl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--p)}
.small{font-size:12px}
.para{font-size:13px;line-height:1.6;color:var(--ink2)}

/* buttons */
.ib{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 40px;background:#fff;border:1px solid var(--line);color:var(--ink);transition:background .15s,border-color .15s}
.ib:hover{background:var(--bg2);border-color:#DAD6E4}
.ib.flat{border-color:transparent;background:transparent}
.ib.flat:hover{background:var(--bg2)}
.ib.float{border:0;background:#fff;box-shadow:0 2px 10px rgba(23,23,23,.12)}
.ib.av{border-radius:20px;background:var(--pl);border-color:var(--pl);color:var(--p);font-weight:600;font-size:15px}
.ib.pri{background:var(--p);border-color:var(--p);color:#fff}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--p);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid #fff;line-height:1}
.btn{height:50px;border-radius:12px;padding:0 20px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s}
.btn.sm{height:40px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.pri{background:var(--p);color:#fff}.btn.pri:hover{background:var(--ph)}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.sec:hover{background:var(--bg2)}
.btn.soft{background:var(--pl);color:var(--p)}.btn.soft:hover{background:var(--pl2)}
.btn.dash{background:#fff;border:1.5px dashed #CFCADB;color:var(--ink2)}
.btn.danger{background:#fff;border:1px solid #F1C4C4;color:var(--err)}.btn.danger:hover{background:var(--errs)}
.btn.redf{background:var(--err);color:#fff}
.btn.full{width:100%}
.press:active,.btn:active,.add:active,.cta:active,.chip:active,.tile:active{transform:scale(.97)}
.cta{width:100%;height:56px;border-radius:14px;background:var(--p);color:#fff;font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;transition:background .15s}
.cta:hover{background:var(--ph)}
.cta b{font-weight:600}
.add{height:34px;padding:0 12px 0 10px;border-radius:10px;background:var(--p);color:#fff;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;transition:background .15s}
.add:hover{background:var(--ph)}
.stp{display:inline-flex;align-items:center;background:var(--pl);color:var(--p);border-radius:10px;height:34px;flex:0 0 auto}
.stp button{width:30px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.stp button:hover{background:var(--pl2)}
.stp span{min-width:18px;text-align:center;font-weight:600;font-size:14px}
.va{font-size:13px;font-weight:500;color:var(--p);min-height:40px;display:flex;align-items:center;gap:2px}
.va:hover{color:var(--ph)}
.chip{flex:0 0 auto;height:36px;padding:0 16px;border-radius:20px;font-size:13px;font-weight:500;background:#fff;border:1px solid var(--line);color:var(--ink2);transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:#D6D2E2}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.pill.g{background:var(--oks);color:var(--okt)}
.pill.p{background:var(--pl);color:var(--p)}
.pill.n{background:var(--bg2);color:var(--ink2);border:1px solid var(--line)}

/* surfaces */
.card{background:#fff;border:1px solid var(--line);border-radius:18px}
.card.pad{padding:16px}
.soft{background:var(--bg2);border-radius:16px}
.thumb{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--bg2);color:#C2BBD4}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.leaf{border-radius:16px 6px 16px 6px}
.icb{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:var(--bg2);color:var(--ink);display:flex;align-items:center;justify-content:center}
.icb.p{background:var(--pl);color:var(--p)}
.mono{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);font-weight:600;flex:0 0 auto}

/* home header */
.hhead{padding:calc(14px + var(--st)) 16px 14px;display:flex;flex-direction:column;gap:14px;background:#fff;border-bottom:1px solid var(--line2);flex:0 0 auto}
.wordmark{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.1;display:flex;align-items:flex-end;gap:2px}
.wordmark i{width:7px;height:7px;border-radius:4px;background:var(--p);margin-bottom:4px}
.loc{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);min-height:26px;margin-top:2px;max-width:200px}
.loc b{font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hicons{display:flex;gap:8px}
.search{display:flex;align-items:center;gap:10px;height:50px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);padding:0 6px 0 14px;transition:border-color .15s,box-shadow .15s,background .15s}
.search:focus-within{border-color:var(--p);box-shadow:0 0 0 3px var(--pl);background:#fff}
.search .sbtn{flex:1;display:flex;align-items:center;gap:10px;height:100%;color:var(--muted);font-size:14px;min-width:0}
.search input{flex:1;border:0;outline:none;background:transparent;font-size:16px;min-width:0}
.fbtn{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s}
.fbtn:hover{background:var(--ph)}

/* hero */
.hero{position:relative;margin:16px 16px 0;border-radius:20px;background:var(--pl);overflow:hidden;min-height:214px;padding:20px 18px}
.hero-tx{position:relative;z-index:1;width:57%;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.hero h1{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.hero p{font-size:12px;line-height:1.55;color:#57526A;margin-bottom:6px}
.hero-img{position:absolute;top:14px;right:14px;bottom:14px;width:38%;border-radius:44px 14px 14px 14px}

/* category tile */
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .1s}
.tile .thumb{width:100%;aspect-ratio:1;border-radius:18px 6px 18px 6px}
.tile:hover .thumb img,.pcard:hover .pimg img,.ccard:hover .thumb img{transform:scale(1.05)}
.tile span.nm{font-size:12px;font-weight:500;text-align:center;line-height:1.3;color:var(--ink2)}
.ccard{display:flex;flex-direction:column;gap:10px;padding:8px 8px 14px;text-align:left;transition:box-shadow .2s,border-color .2s}
.ccard:hover,.pcard:hover{box-shadow:var(--sh);border-color:#E0DCEA}
.ccard .thumb{width:100%;aspect-ratio:4/3;border-radius:14px 6px 14px 6px}

/* product card */
.pcard{display:flex;flex-direction:column;gap:10px;padding:8px 8px 12px;background:#fff;border:1px solid var(--line);border-radius:18px;transition:box-shadow .2s,border-color .2s;min-width:0}
.pimg{width:100%;aspect-ratio:4/3;border-radius:14px 6px 14px 6px}
.pbody{display:flex;flex-direction:column;gap:4px;padding:0 4px;text-align:left}
.pbrand{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname{font-size:14px;font-weight:500;line-height:1.35;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.meta>span{display:inline-flex;align-items:center;gap:4px}
.pfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:auto;padding:0 4px}
.price{font-weight:600;font-size:16px;color:var(--p);line-height:1.2}
.strike{text-decoration:line-through;color:var(--muted);font-size:11px}
.heart{position:absolute;top:8px;right:8px;z-index:2;width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(23,23,23,.12)}
.tag{position:absolute;top:8px;left:8px;z-index:2}
.rcard{display:flex;gap:12px;align-items:center;padding:8px;background:#fff;border:1px solid var(--line);border-radius:18px}
.rcard .thumb{width:88px;height:88px;flex:0 0 88px;border-radius:14px 6px 14px 6px}

/* lists, forms, choices */
.lrow{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:10px 14px;text-align:left;border-bottom:1px solid var(--line2);transition:background .15s}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--bg2)}
.lrow .tx{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.lrow .t{font-size:14px;font-weight:500}
.lrow .s{font-size:12px;color:var(--muted)}
.choice{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;text-align:left;background:#fff;border:1px solid var(--line);transition:border-color .15s,background .15s}
.choice:hover{border-color:#D6D2E2}
.choice.on{border-color:var(--p);background:#FBF9FF;box-shadow:inset 0 0 0 1px var(--p)}
.choice .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.choice .t{font-weight:500;font-size:14px}
.choice .s{font-size:12px;line-height:1.45;color:var(--muted)}
.rad{width:20px;height:20px;flex:0 0 20px;border-radius:10px;border:2px solid #C9C4D6;transition:border .15s}
.choice.on .rad{border:6px solid var(--p)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:13px;font-weight:500}
.inp{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.inp{height:auto;padding:12px 14px;resize:none}
.inp:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--pl)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;padding:11px 0;border-bottom:1px solid var(--line2)}
.kv:last-child{border-bottom:0}
.kv>span:first-child{color:var(--muted)}
.kv>span:last-child{font-weight:500;text-align:right}
.bill{display:flex;flex-direction:column;gap:10px;font-size:14px}
.bill .row>span:first-child{color:var(--muted)}
.bill .tot{border-top:1px dashed var(--line);padding-top:12px;font-weight:600;font-size:16px}
.bill .tot>span:first-child{color:var(--ink)}
.bill .tot>span:last-child{color:var(--p)}

/* chrome */
.topbar{padding:calc(10px + var(--st)) 12px 10px;display:flex;align-items:center;gap:8px;background:#fff;border-bottom:1px solid var(--line2);flex:0 0 auto}
.topbar h1{flex:1;font-size:18px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar h1.pad{padding-left:4px}
.botbar{padding:12px 16px calc(14px + var(--sb));border-top:1px solid var(--line2);background:#fff;flex:0 0 auto}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(68px + var(--sb));padding-bottom:var(--sb);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));z-index:5}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11px;font-weight:500;transition:color .15s}
.tabbar button:hover{color:var(--ink)}
.tabbar button[aria-current=page]{color:var(--p)}
.tabbar button[aria-current=page]::before{content:'';position:absolute;top:-1px;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:var(--p)}
.cartbar{position:absolute;left:16px;right:16px;width:auto;z-index:4;box-shadow:0 10px 28px rgba(112,40,232,.32)}
.toast{position:absolute;left:16px;right:16px;z-index:9;background:var(--ink);color:#fff;border-radius:12px;padding:14px 16px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px;animation:pgIn .2s ease-out}
.sheet{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end}
.sheet .dim{position:absolute;inset:0;background:rgba(23,23,23,.45)}
.sheet [role=dialog]{position:relative;background:#fff;border-radius:24px 24px 0 0;padding:12px 20px calc(24px + var(--sb));display:flex;flex-direction:column;gap:14px;animation:pgIn .2s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.empty{padding:56px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty .icb{width:64px;height:64px;border-radius:20px;margin-bottom:6px}

/* product page, tracking */
.stat{background:var(--bg2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.stat .k{font-size:11px;color:var(--muted)}
.stat .v{font-size:13px;font-weight:500;line-height:1.3}
.bar{height:6px;border-radius:3px;background:var(--line);flex:1;overflow:hidden}
.bar i{display:block;height:100%;background:var(--p);border-radius:3px}
#pin{transition:left 1.2s ease,top 1.2s ease}
.tl{display:flex;gap:14px}
.tl .dot{width:32px;height:32px;flex:0 0 32px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:#fff;border:1.5px solid var(--line);color:#B5AFC4}
.tl.done .dot{background:var(--p);border-color:var(--p);color:#fff}
.tl.now .dot{box-shadow:0 0 0 5px var(--pl)}
.tl .ln{width:2px;flex:1;min-height:16px;background:var(--line);margin:4px 0}
.tl.done .ln.on{background:var(--p)}
.tl .tx{display:flex;flex-direction:column;gap:2px;padding:5px 0 18px;flex:1}
.tl .t{font-size:14px;font-weight:500;color:var(--muted)}
.tl.done .t{color:var(--ink)}
.tl .s{font-size:12px;color:var(--muted)}
.live{width:8px;height:8px;border-radius:4px;background:var(--p);display:inline-block;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(112,40,232,.45)}70%{box-shadow:0 0 0 7px rgba(112,40,232,0)}100%{box-shadow:0 0 0 0 rgba(112,40,232,0)}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>

 if(t.n&&['home','cats','cat','coll','brand','brands','trending','wish','search'].indexOf(v.s)>-1)h+='<button class="cta cartbar" data-act="cart" style="bottom:calc('+(hasNav?80:16)+'px + var(--sb))"><span style="display:flex;flex-direction:column;align-items:flex-start;gap:0"><span style="font-size:11px;opacity:.85">'+t.n+(t.n===1?' item':' items')+' · '+Math.round(t.w)+' kg</span><b>'+inr(t.sub)+'</b></span><span style="display:flex;align-items:center;gap:6px">View cart'+ico(I.arrow,16,2)+'</span></button>';
 if(hasNav)h+=vNav();
 var app=document.getElementById('app');
 var om=app.querySelector('[data-main]'),keep=(!nav&&om)?om.scrollTop:0;
 var hadFocus=document.activeElement&&document.activeElement.id==='q',caret=hadFocus?document.activeElement.selectionStart:null;
 var rows={};if(!nav)app.querySelectorAll('[data-slider]').forEach(function(r){rows[r.dataset.slider]=r.scrollLeft});
 app.innerHTML=h;
 if(nav&&app.firstChild)app.firstChild.classList.add('enter');
 var m=app.querySelector('[data-main]');if(m)m.scrollTop=keep;
 app.querySelectorAll('[data-slider]').forEach(function(r){if(rows[r.dataset.slider])r.scrollLeft=rows[r.dataset.slider];slUpdate(r)});
 var q=document.getElementById('q');if(q&&(hadFocus||(nav&&v.s==='search'&&!S.query))){q.focus();if(caret!=null)q.setSelectionRange(caret,caret)}
}
function slUpdate(r){var w=r.parentNode,max=r.scrollWidth-r.clientWidth;w.classList.toggle('at-start',r.scrollLeft<=2);w.classList.toggle('at-end',r.scrollLeft>=max-2);
 var bar=w.querySelector('.sl-bar i');if(bar){bar.style.width=(r.clientWidth/r.scrollWidth*100)+'%';bar.style.left=(r.scrollLeft/r.scrollWidth*100)+'%'}}
function setQty(id,q){if(q<=0)delete S.cart[id];else S.cart[id]=q;render()}
function placeOrder(){
 var t=totals(),names=Object.keys(S.cart).map(function(id){return P(id).name+' × '+S.cart[id]}).join(', ');
 var id='#IB-'+(20417+S.orders.length);
 S.orders.unshift({id:id,status:'Live',summary:names,date:'Today',total:t.total});
 S.orderId=id;S.lastVehicle=t.v.name;S.lastWeight=t.w;S.cart={};S.step=0;S.stepAt=[clock()];S.stack=[{s:'home'},{s:'track'}];render(true);
 clearInterval(timer);
 timer=setInterval(function(){if(S.step>=4){clearInterval(timer);S.orders[0].status='Delivered';if(cur().s==='orders')render();return}S.step++;S.stepAt[S.step]=clock();if(cur().s==='track')render()},2500);
}
document.getElementById('app').addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,id=b.dataset.id;
 switch(a){
 case 'inc':setQty(id,(S.cart[id]||0)+1);break;
 case 'dec':setQty(id,(S.cart[id]||0)-1);break;
 case 'rm':setQty(id,0);break;
 case 'setq':setQty(id,+b.dataset.n);break;
 case 'wish':if(S.wish[id])delete S.wish[id];else S.wish[id]=1;render();break;
 case 'open':push({s:'product',id:id});break;
 case 'cat':S.sort='pop';push({s:'cat',id:id});break;
 case 'swapcat':S.stack[S.stack.length-1]={s:'cat',id:id};render(true);break;
 case 'coll':S.sort='pop';push({s:'coll',id:id});break;
 case 'brands':push({s:'brands'});break;
 case 'brand':S.sort='pop';push({s:'brand',id:id});break;
 case 'cats':root({s:'cats'});break;
 case 'profile':S.sheet=0;push({s:'profile'});break;
 case 'sub':S.toast='';push({s:'sub',id:id});break;
 case 'logout':S.sheet=1;render();break;
 case 'closesheet':S.sheet=0;render();break;
 case 'dologout':S.sheet=0;root({s:'login'});break;
 case 'login':root({s:'home'});break;
 case 'saved':S.toast='Saved';render();setTimeout(function(){S.toast='';back()},1100);break;
 case 'dl':S.toast='Invoice downloaded';render();setTimeout(function(){S.toast='';render()},1500);break;
 case 'role':S.role=id;render();break;
 case 'site':S.site=id;render();break;
 case 'pay':S.pay=id;render();break;
 case 'reason':S.reason=+id;render();break;
 case 'lang':S.lang=id;render();break;
 case 'faq':S.faq=S.faq===+id?-1:+id;render();break;
 case 'wishlist':push({s:'wish'});break;
 case 'search':S.query='';push({s:'search'});break;
 case 'q':S.query=id;render();break;
 case 'sort':S.sort=id;render();break;
 case 'back':back();break;
 case 'home':root({s:'home'});break;
 case 'cart':push({s:'cart'});break;
 case 'checkout':push({s:'checkout'});break;
 case 'tab':root({s:id});break;
 case 'track':push({s:'track'});break;
 case 'slot':S.slot=id;render();break;
 case 'place':placeOrder();break;
 case 'reorder':S.cart={p1:20,p5:15};push({s:'cart'});break;
 case 'slide':var r=b.parentNode.querySelector('[data-slider]');r.scrollBy({left:+b.dataset.dir*Math.max(160,r.clientWidth*.8),behavior:'smooth'});break;
 case 'toreviews':var r=document.getElementById('reviews');if(r)r.scrollIntoView({behavior:'smooth'});break;
 }
});
document.getElementById('app').addEventListener('input',function(e){if(e.target.id==='q'){S.query=e.target.value;render()}});
/* sliders: progress on scroll, and drag-to-scroll for mouse users (touch already swipes natively) */
var drag=null,dragged=false,FIT=1;
document.getElementById('app').addEventListener('scroll',function(e){var t=e.target;if(t.dataset&&t.dataset.slider!=null)slUpdate(t)},true);
document.getElementById('app').addEventListener('pointerdown',function(e){dragged=false;if(e.pointerType!=='mouse'||e.button!==0)return;var r=e.target.closest('[data-slider]');if(r)drag={r:r,x:e.clientX,l:r.scrollLeft}});
addEventListener('pointermove',function(e){if(!drag)return;var dx=(e.clientX-drag.x)/FIT;if(!dragged&&Math.abs(dx)>6){dragged=true;drag.r.classList.add('dragging')}if(dragged){drag.r.scrollLeft=drag.l-dx;e.preventDefault()}});
addEventListener('pointerup',function(){if(drag){drag.r.classList.remove('dragging');drag=null}});
document.getElementById('app').addEventListener('click',function(e){if(dragged){e.stopPropagation();e.preventDefault();dragged=false}},true);
document.getElementById('app').addEventListener('dragstart',function(e){if(e.target.closest('[data-slider]'))e.preventDefault()});
/* scale the 390x844 mockup down on short desktop windows; phones use the full viewport */
function fit(){var s=innerWidth<500?1:Math.min(1,(innerHeight-32)/844,(innerWidth-32)/390);FIT=s;document.documentElement.style.setProperty('--fit',s)}
addEventListener('resize',fit);fit();
render(true);
</script>
</body>
